name: Metrics
on:
  # Refresh once per day.
  schedule: [{ cron: "0 0 * * *" }]
  # Allow manual refreshes from the Actions tab.
  workflow_dispatch:
  # Refresh after changes to the profile.
  push: { branches: ["main", "master"] }
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out profile files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      # Render the main profile card.
      - name: Metrics (classic)
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          filename: metrics.classic.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: bimoraa
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Seoul
          config_animations: yes
          plugin_gists: yes
          plugin_lines: yes
          plugin_lines_repositories_limit: 4
          plugins_errors_fatal: yes
          # Hide the first header field containing the account age.
          extras_css: |
            .row section .field:first-child { display: none !important; }

      # Render the full-year contribution calendar.
      - name: Metrics (isocalendar full-year)
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          filename: metrics.plugin.isocalendar.fullyear.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: bimoraa
          base: ""
          config_timezone: Asia/Seoul
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugins_errors_fatal: yes

      # Generate languages from the REST API because the upstream plugin can return an empty card.
      - name: Generate language metrics
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 .github/scripts/generate_languages.py

      # Commit the generated language card without requiring a local checkout.
      - name: Publish language metrics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          content_url="repos/${GITHUB_REPOSITORY}/contents/metrics.plugin.languages.svg"
          file_sha="$(gh api "${content_url}?ref=${GITHUB_REF_NAME}" --jq '.sha' 2>/dev/null || true)"
          encoded_content="$(base64 < metrics.plugin.languages.svg | tr -d '\n')"
          if [[ -n "${file_sha}" ]]; then
            gh api --method PUT "${content_url}" \
              -f message='Update metrics.plugin.languages.svg - [Skip GitHub Action]' \
              -f content="${encoded_content}" \
              -f sha="${file_sha}" \
              -f branch="${GITHUB_REF_NAME}" >/dev/null
          else
            gh api --method PUT "${content_url}" \
              -f message='Add metrics.plugin.languages.svg - [Skip GitHub Action]' \
              -f content="${encoded_content}" \
              -f branch="${GITHUB_REF_NAME}" >/dev/null
          fi

      # Render recently starred repositories.
      - name: Metrics (recently starred)
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          filename: metrics.plugin.stars.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: bimoraa
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 3
          plugins_errors_fatal: yes

      # Render notable contributions.
      - name: Metrics (notable contributions)
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          filename: metrics.plugin.notable.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: bimoraa
          base: ""
          plugin_notable: yes
          plugin_notable_repositories: yes
          plugins_errors_fatal: yes
